// Standalone build for the shared source tree.
//
// common/ holds every piece of code that has no confirmed loader/version
// difference. It MAY reference Minecraft and loader types: the split rule is
// "a confirmed version difference", not "platform independence". It compiles
// against the same legacyforge classpath as targets/forge-1.20.1, so it can be
// built and tested on its own:
//
//     gradlew -p common build
//
// Targets compile the original files directly in their own source set.
// Their commonJava blocks exclude files with confirmed version differences;
// this standalone build is not imported by a target.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
}

repositories {
    mavenCentral()
    maven {
        url 'https://api.modrinth.com/maven'
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup 'com.github.mcmodderanchor'
        }
    }
    maven {
        url 'https://maven.sighs.cc/repository/maven-public/'
    }
    mavenLocal()
}

dependencies {
    modImplementation 'com.sighs:ApricityUI-forge-1.20.1:1.2.9'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
